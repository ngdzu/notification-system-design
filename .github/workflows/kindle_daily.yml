name: Send Daily Lesson to Kindle

on:
  schedule:
    # 10:00 UTC corresponds to 6:00 AM EDT (UTC-4) / 5:00 AM EST (UTC-5)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  send-kindle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pandoc, Chromium & Mermaid Filter
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium-browser
          npm install -g mermaid-filter

      - name: Send Next Lesson to Kindle
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          python3 scripts/send_to_kindle.py

      - name: Commit state and generated lessons
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons/ .kindle_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: sent daily lesson to Kindle" && git push)
