name: Send Daily Lesson to Kindle

on:
  schedule:
    # 10:00 UTC corresponds to 6:00 AM EDT (UTC-4) / 5:00 AM EST (UTC-5)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  send-kindle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.6.4

      - name: Send Next Lesson to Kindle
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
        run: |
          python3 scripts/send_to_kindle.py

      - name: Commit state update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .kindle_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: sent daily lesson to Kindle" && git push)
