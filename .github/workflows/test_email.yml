name: Test Email Delivery

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pandoc, Chromium & Mermaid Filter
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium-browser
          npm install -g @mermaid-js/mermaid-cli mermaid-filter

      - name: Send Test Email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          python3 scripts/test_email.py --to "${{ secrets.SMTP_USER }}"
